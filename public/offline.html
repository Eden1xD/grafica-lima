<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sem conexão — Gráfica Lima</title>
<style>
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:#F6F8F6; font-family:Inter,system-ui,sans-serif; color:#173331; }
  .card { text-align:center; padding:40px; max-width:420px; }
  .mark { width:72px; height:72px; border-radius:18px; background:#EAF3E9; border:2px solid #ACD0A8; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-family:Georgia,serif; font-weight:700; font-size:30px; color:#07585B; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#64746E; font-size:14px; line-height:1.6; }
  button { margin-top:18px; background:#087F80; color:#fff; border:0; border-radius:12px; padding:12px 24px; font-weight:600; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">GL</div>
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar a página. Seus dados estão seguros no servidor — reconecte-se para continuar de onde parou.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
